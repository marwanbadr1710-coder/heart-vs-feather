<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
html{box-sizing:border-box;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text}
img{max-width:100%}
[hidden]{display:none!important}

<body>
<title>Heart vs Feather</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Marcellus&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
/* Layout: a phone-first life sim. Lapis night sky, gold leaf type, a scrolling life log, stats + actions pinned at the bottom. */
:root{
  --night:#0d1328;--night-2:#151d3a;--night-3:#1e2852;
  --ink:#ece3cc;--ink-dim:#a49d8a;
  --gold:#d9a93f;--faience:#3fc1b0;--carnelian:#d9573b;--ember:#e8823a;
  --line:rgba(217,169,63,.22);
  --f-display:"Metamorphous","Marcellus",Georgia,serif;
  --f-head:"Marcellus",Georgia,serif;
  --f-body:"Alegreya Sans",system-ui,sans-serif;
  --f-glyph:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%,rgba(232,130,58,.28),transparent 60%),radial-gradient(90% 40% at 50% 0%,rgba(217,87,59,.18),transparent 70%),var(--night);
  border-inline:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ava{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--night-3);border:1px solid var(--gold);font-family:var(--f-glyph);font-size:26px;color:var(--gold)}
.who{min-width:0;flex:1}
.who h1{margin:0;font-family:var(--f-head);font-weight:400;font-size:21px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{margin:2px 0 0;color:var(--ink-dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.traits{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.traits span{font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--gold)}
.purse{text-align:right;flex:none}
.purse b{display:block;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.purse span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.view{position:relative;flex:0 0 auto;height:clamp(200px,42vh,460px);background:#05070f;overflow:hidden;border-bottom:1px solid var(--line)}
.view canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
.cap{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;padding:5px 14px;border-radius:20px;background:rgba(7,10,22,.72);border:1px solid var(--line);color:var(--ink);font-family:var(--f-head);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s;pointer-events:none}
.cap.on{opacity:1}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.vlabel{position:absolute;left:12px;bottom:9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(236,227,204,.85);text-shadow:0 1px 3px #000;pointer-events:none}
.vhint{position:absolute;right:12px;bottom:9px;font-size:11px;color:rgba(236,227,204,.6);text-shadow:0 1px 3px #000;pointer-events:none}
.log{flex:1;min-height:0;overflow-y:auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.year{padding-block:12px 4px;border-bottom:1px dashed rgba(217,169,63,.12)}
.year h3{margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.year p{margin:0 0 8px;line-height:1.45;max-width:62ch}
.year p.bad{color:#f0b3a3}.year p.good{color:#bfeee6}.year p.dim{color:var(--ink-dim)}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:1px}
.chip{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--night-3);color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.up{color:var(--faience)}.chip.down{color:var(--carnelian)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:rgba(13,19,40,.85)}
.stat{display:grid;grid-template-columns:62px 1fr 28px;align-items:center;gap:8px;font-size:13px}
.stat label{color:var(--ink-dim);letter-spacing:.04em}
.bar{height:7px;border-radius:4px;background:var(--night-3);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:4px;background:var(--faience);transition:width .5s ease,background .5s}
.stat output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.stat.maat .bar i{background:var(--gold)}
.curse{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim)}
.pips{display:flex;gap:4px}
.pips span{width:13px;height:13px;border-radius:50%;border:1px solid rgba(217,87,59,.5)}
.pips span.on{background:var(--carnelian);box-shadow:0 0 8px rgba(217,87,59,.7)}
.actions{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:end;gap:6px;padding-block:8px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--night-2);border-top:1px solid var(--line)}
.act{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-size:12px;color:var(--ink-dim)}
.act .g{font-family:var(--f-glyph);font-size:22px;color:var(--ink);line-height:1.1}
.act:hover{background:var(--night-3)}
.age{width:76px;height:76px;margin-top:-30px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#f0bf55,#b07d1f 70%);color:#1b1408;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--night-2),0 6px 24px rgba(232,130,58,.45)}
.age b{font-family:var(--f-display);font-size:26px;line-height:1}
.age span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.age:active{transform:scale(.96)}
.veil{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:60%;overflow-y:auto;background:var(--night-2);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:rise .25s ease-out;box-sizing:border-box}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
.sheet .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.sheet h2{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:24px;text-wrap:balance}
.sheet .body{margin:0 0 16px;line-height:1.5;font-size:17px}
.sheet .note{margin:0 0 12px;color:var(--ink-dim);font-size:14px;line-height:1.45}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--night-3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choice:hover{border-color:var(--gold)}
.choice small{color:var(--ink-dim);font-size:13px;white-space:nowrap;text-align:right}
.choice[disabled]{opacity:.42;cursor:not-allowed}
.sec{margin:14px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cat{background:var(--night-3);border:1px solid var(--line);border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.cat .g{font-family:var(--f-glyph);font-size:26px;color:var(--gold)}
.cat small{color:var(--ink-dim);font-size:12px}
.cat:hover{border-color:var(--gold)}
.close{margin-top:12px;width:100%;background:none;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink-dim)}
.result{background:rgba(63,193,176,.08);border:1px solid rgba(63,193,176,.3);border-radius:10px;padding:12px 14px;line-height:1.45;margin-bottom:12px}
.result.bad{background:rgba(217,87,59,.08);border-color:rgba(217,87,59,.35)}
.result .chips{display:flex;margin:8px 0 0}
.hall{position:fixed;inset:0;z-index:30;overflow-y:auto;background:radial-gradient(80% 50% at 50% 30%,rgba(217,169,63,.18),transparent 70%),#070a16;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hall-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.hall h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--gold);text-wrap:balance}
.hall .sub{margin:0;color:var(--ink-dim)}
.scale{width:100%;max-width:340px}
.scale .beam{transform-box:view-box;transform-origin:170px 70px;transition:transform 1.4s cubic-bezier(.3,1.6,.5,1)}
.scale .panL,.scale .panR{transition:transform 1.4s cubic-bezier(.3,1.6,.5,1)}
.wobble .beam{animation:wob 1.6s ease-in-out}
@keyframes wob{25%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.conf{list-style:none;padding:0;margin:0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.conf li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:8px;background:var(--night-2);font-size:15px;opacity:0;transform:translateY(6px);transition:all .35s}
.conf li.show{opacity:1;transform:none}
.conf li b{font-size:12px;letter-spacing:.12em;flex:none}
.conf li b.t{color:var(--faience)}.conf li b.l{color:var(--carnelian)}
.verdict{font-family:var(--f-head);font-size:22px;line-height:1.3;margin:0;min-height:1em}
.card{width:100%;box-sizing:border-box;background:var(--night-2);border:1px solid var(--gold);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px}
.card .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:15px}
.card .row span:first-child{color:var(--ink-dim)}
.card .row span:last-child{text-align:right}
.big-btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--gold);color:#1b1408;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.start{position:fixed;inset:0;z-index:25;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,rgba(232,130,58,.35),transparent 60%),var(--night);padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;text-align:center}
.start .glyphs{font-family:var(--f-glyph);font-size:34px;color:var(--gold);letter-spacing:.3em}
.start h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11vw,54px);line-height:1;color:var(--ink);text-shadow:0 0 30px rgba(232,130,58,.5)}
.start .tag{margin:0;color:var(--ink-dim);font-size:17px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px;text-align:left}
.opts label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;background:var(--night-3);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.start input{width:100%;box-sizing:border-box;background:var(--night-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="ava" id="ava" aria-hidden="true">𓀀</div>
    <div class="who"><h1 id="name">—</h1><p id="meta">—</p><div class="traits" id="traits"></div></div>
    <div class="purse"><b id="deben">0</b><span>deben</span></div>
  </header>
  <div class="view" id="view"><canvas id="cv" aria-label="First-person view of your life in Ancient Egypt"></canvas><div class="fade" id="fade"></div><div class="cap" id="cap"></div><div class="vlabel" id="locname">Home</div><div class="vhint">Drag to look around</div></div>
  <main class="log" id="log" aria-live="polite"></main>
  <section class="stats" aria-label="Your stats">
    <div class="stat" data-k="health"><label>Health</label><div class="bar"><i></i></div><output>0</output></div>
    <div class="stat" data-k="happy"><label>Happiness</label><div class="bar"><i></i></div><output>0</output></div>
    <div class="stat" data-k="smarts"><label>Smarts</label><div class="bar"><i></i></div><output>0</output></div>
    <div class="stat" data-k="looks"><label>Looks</label><div class="bar"><i></i></div><output>0</output></div>
    <div class="stat maat" data-k="maat"><label>Ma'at</label><div class="bar"><i></i></div><output>0</output></div>
    <div class="curse"><span>Curses</span><div class="pips" id="pips"></div></div>
  </section>
  <nav class="actions">
    <button class="act" id="bJob"><span class="g">𓌳</span>Work</button>
    <button class="act" id="bPeople"><span class="g">𓀗</span>People</button>
    <button class="age" id="bAge"><b>+</b><span>Age</span></button>
    <button class="act" id="bAct"><span class="g">𓋹</span>Activities</button>
    <button class="act" id="bMore"><span class="g">𓁹</span>Life</button>
  </nav>
</div>
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="start" id="start" hidden></div>
<div class="hall" id="hall" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= 3D first-person world ================= */
window.W=(function(){
const noop={play:()=>Promise.resolve(),shot(){},setAge(){},age(){},reset(){}};
if(!window.THREE)return noop;
const T=THREE;
const view=document.getElementById("view"),cv=document.getElementById("cv"),capEl=document.getElementById("cap"),fadeEl=document.getElementById("fade"),locEl=document.getElementById("locname");
let renderer;
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:true})}catch(e){view.hidden=true;return noop}
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(64,1,0.03,1400);scene.add(camera);

/* ---- helpers ---- */
const MC={};
function M(c,o){const k=c+(o?JSON.stringify(o):"");if(!MC[k])MC[k]=new T.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o||{}));return MC[k]}
function add(geo,mat,x,y,z,p){const m=new T.Mesh(geo,typeof mat==="string"?M(mat):mat);m.position.set(x,y,z);(p||scene).add(m);return m}
function box(w,h,d,c,x,z,y,p){return add(new T.BoxGeometry(w,h,d),c,x,(y||0)+h/2,z,p)}
function cyl(rt,rb,h,c,x,z,y,seg,p){return add(new T.CylinderGeometry(rt,rb,h,seg||8),c,x,(y||0)+h/2,z,p)}
function ball(r,c,x,y,z,p,sx,sy,sz){const m=add(new T.SphereGeometry(r,10,8),c,x,y,z,p);if(sx)m.scale.set(sx,sy,sz);return m}
function cone(r,h,seg,c,x,z,y,p){return add(new T.ConeGeometry(r,h,seg),c,x,(y||0)+h/2,z,p)}
const flameMat=new T.MeshBasicMaterial({color:"#ffb347"});
const glowMat=new T.MeshBasicMaterial({color:"#ffd36b"});
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---- sky, light ---- */
const skyU={top:{value:new T.Color("#6aa6cf")},bot:{value:new T.Color("#f3cf9a")}};
const sky=new T.Mesh(new T.SphereGeometry(900,24,12),new T.ShaderMaterial({uniforms:skyU,side:T.BackSide,depthWrite:false,
  vertexShader:"varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"uniform vec3 top;uniform vec3 bot;varying float h;void main(){gl_FragColor=vec4(mix(bot,top,clamp(h*2.4,0.0,1.0)),1.0);}"}));
scene.add(sky);
scene.fog=new T.Fog("#f3cf9a",70,480);
const hemi=new T.HemisphereLight(0xfff0d8,0x8a6a3c,0.85);scene.add(hemi);
const sun=new T.DirectionalLight(0xffe2b8,0.95);sun.position.set(-60,90,40);scene.add(sun);
const moon=new T.DirectionalLight(0x8fa8ff,0);moon.position.set(40,60,-30);scene.add(moon);
const torchLight=new T.PointLight(0xff9a3c,0,10,2);torchLight.position.set(0.25,0.05,-0.45);camera.add(torchLight);
const starG=new T.BufferGeometry();const sp=[];for(let i=0;i<700;i++){const th=Math.random()*Math.PI*2,ph=Math.random()*1.35;sp.push(Math.cos(th)*Math.sin(ph)*800,Math.cos(ph)*800,Math.sin(th)*Math.sin(ph)*800)}
starG.setAttribute("position",new T.Float32BufferAttribute(sp,3));
const starMat=new T.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false,fog:false});
const stars=new T.Points(starG,starMat);scene.add(stars);

/* ---- world ---- */
const ground=add(new T.PlaneGeometry(2000,2000),"#d6b47a",0,0,0);ground.rotation.x=-Math.PI/2;
box(900,0.06,3,"#9c7b48",0,-27);
const wg=new T.PlaneGeometry(900,64,90,8);
const water=add(wg,new T.MeshLambertMaterial({color:"#2c7a86",flatShading:true}),0,0.06,-60);water.rotation.x=-Math.PI/2;
const wp=wg.attributes.position,wbase=Float32Array.from(wp.array);
const rg=new T.CylinderGeometry(0.02,0.05,1.8,4);rg.translate(0,0.9,0);
const reeds=new T.InstancedMesh(rg,M("#6b8a3a"),520);const dm=new T.Object3D();let ri=0;
while(ri<520){const cx=rnd(-170,170);if(Math.abs(cx)<5)continue;for(let j=0;j<10&&ri<520;j++){dm.position.set(cx+rnd(-1.5,1.5),0,-27.6-rnd(0,3));dm.rotation.set(rnd(-.18,.18),0,rnd(-.18,.18));dm.scale.setScalar(rnd(.6,1.4));dm.updateMatrix();reeds.setMatrixAt(ri++,dm.matrix)}}
reeds.instanceMatrix.needsUpdate=true;scene.add(reeds);
function palm(x,z,h){const g=new T.Group();g.position.set(x,0,z);g.rotation.z=rnd(-.08,.08);scene.add(g);cyl(0.15,0.26,h,"#7a5a36",0,0,0,6,g);

const DEF_PROP={write:"pen",eat:"bread",drink:"cup",give:"coin",smash:"pot",carry:"jar",fish:"rod",torch:"torch",throw:"fig",offer:"bread",touchface:"kohl"};

/* ---- state ---- */
let cine=null,trav=null,tl=null,tod=0,todTarget=0,fadeV=0,deadFade=0,yawD=0,pitchD=0,proj=null;
const curL=REST_L.slice(),curR=REST_R.slice();
function caption(t){if(t){capEl.textContent=t;capEl.classList.add("on")}else capEl.classList.remove("on")}
function applyLoc(name){locName=name;loc=LOC[name]||LOC.home;locEl.textContent=loc.name;lookT.set(loc.t[0],loc.t[1],loc.t[2])}
function goTo(name,spec,night){
  const n=LOC[name]?name:locName;todTarget=night?1:0;
  if(n!==locName){trav={to:n,spec,t0:now(),snapped:false};return 0.55}
  spawn(spec);return 0.15;
}
const now=()=>performance.now()/1000;
function shot(cue){if(!cue)return;goTo(cue.loc,cue.actor,cue.night)}
function play(cue,res){
  cue=cue||{};

    const delay=goTo(cue.loc||locName,cue.actor,cue.night);
    const death=!!(res&&res[3]);

}

/* ---- input ---- */
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});

if(window.ResizeObserver)new ResizeObserver(resize).observe(view);window.addEventListener("resize",resize);resize();

/* ---- loop ---- */
const C_TOP_D=new T.Color("#6aa6cf"),C_TOP_N=new T.Color("#070b22"),C_BOT_D=new T.Color("#f3cf9a"),C_BOT_N=new T.Color("#1c2350"),C_TMP=new T.Color(),C_TMP2=new T.Color();
let last=now(),clock=0;
const tmpV=new T.Vector3(),tmpV2=new T.Vector3();
function loop(){
  const tN=now(),dt=Math.min(0.05,tN-last);last=tN;clock+=dt;
  // travel with fade cut
  let fadeTravel=0;
  if(trav){const k=(tN-trav.t0)/0.55;if(!trav.snapped&&k>=0.5){applyLoc(trav.to);spawn(trav.spec);trav.snapped=true}
    fadeTravel=k<0.5?k*2:Math.max(0,2-k*2);if(k>=1)trav=null}
  // time of day

  let todE=tod;if(tl){const k=(tN-tl)/1.3;if(k>=1)tl=null;else todE=Math.max(tod,sin(k*PI))}
  const dark=!!loc.dark;

  C_TMP2.copy(C_BOT_D).lerp(C_BOT_N,todE);if(todE>0.15&&todE<0.85)C_TMP2.lerp(new T.Color("#e07a3a"),0.35*sin((todE-0.15)/0.7*PI));
  skyU.bot.value.copy(C_TMP2);
  if(dark){scene.fog.color.set("#000000");scene.fog.near=1;scene.fog.far=16;hemi.intensity=0.05;sun.intensity=0;moon.intensity=0;torchLight.intensity=1.5+0.25*sin(clock*17)+0.15*sin(clock*29)}
  else{scene.fog.color.copy(C_TMP2);scene.fog.near=70;scene.fog.far=480;hemi.intensity=0.85-0.68*todE;sun.intensity=0.95*(1-todE);moon.intensity=0.4*todE;torchLight.intensity=(cine&&cine.prop==="torch")?1.2:0}
  starMat.opacity=dark?0:todE;
  // water
  for(let i=0;i<wp.count;i++){const x=wbase[i*3],y=wbase[i*3+1];wp.array[i*3+2]=sin(x*0.3+clock*1.2)*0.06+Math.cos(y*0.5+clock)*0.05}
  wp.needsUpdate=true;
  // gesture
  let out={},t=0,e=0;
  if(cine&&tN>=cine.t0){t=Math.min(1,(tN-cine.t0)/cine.dur);e=cine.death?Math.min(1,t/0.18):env(t);out=G[cine.g](t,e)||{};
    if(cine.prop&&P[cine.prop])P[cine.prop].visible=!out.drop&&e>0.05;
    papyrus.visible=!!out.papyrus;board.visible=!!out.board;
    if(out.launch&&!cine.launched){cine.launched=true;const m=new T.Mesh(new T.SphereGeometry(0.05,6,4),M("#5a2a4a"));HR.getWorldPosition(m.position);const v=new T.Vector3();camera.getWorldDirection(v);proj={m,v:v.multiplyScalar(9).add(new T.Vector3(0,3,0)),t:0};scene.add(m)}
    if(t>=1&&!cine.ending){cine.ending=true;setTimeout(endCine,cine.death?50:250)}
  }
  if(proj){proj.t+=dt;proj.v.y-=12*dt;proj.m.position.addScaledVector(proj.v,dt);if(proj.t>1.4){scene.remove(proj.m);proj=null}}
  const cam=out.cam||{};
  // hands
  const tl_=out.L||REST_L,tr_=out.R||REST_R,hk=Math.min(1,dt*16);
  for(let i=0;i<6;i++){curL[i]+=(tl_[i]-curL[i])*hk;curR[i]+=(tr_[i]-curR[i])*hk}
  [[HL,curL],[HR,curR]].forEach(([h,a])=>{h.position.set(a[0],a[1],a[2]);h.rotation.set(a[3],a[4],a[5]);h.scale.setScalar(handScale)});
  // actor
  if(actor){const u=actor.userData,b=u.base,k=u.k;
    const bad=cine&&cine.tone==="bad",lunge=cine&&(cine.death||bad)&&t>0.35?sm(Math.min(1,(t-0.35)/0.4)):0;
    const d=dirXZ();
    if(k==="hippo"){actor.position.y+=((-0.35)-actor.position.y)*Math.min(1,dt*1.5);if(u.head)u.head.rotation.x=bad?-0.6*sin(Math.min(1,t)*PI):0;actor.position.x=b.x-d.x*lunge*3;actor.position.z=b.z-d.z*lunge*3}
    else if(k==="croc"){u.jaw.rotation.x=-(0.15+0.12*sin(clock*2))-lunge*0.7;actor.position.x=b.x-d.x*lunge*2.6;actor.position.z=b.z-d.z*lunge*2.6}
    else if(k==="cat"){u.tail.rotation.y=sin(clock*3)*0.6;u.head.rotation.y=sin(clock*0.7)*0.3;if(cine&&cine.g==="pet")actor.scale.y=1+0.04*sin(clock*20)}
    else if(k==="goose"||k==="goat"){u.head.rotation.x=sin(clock*4)*0.15;actor.position.x=b.x-d.x*lunge*1.2;actor.position.z=b.z-d.z*lunge*1.2}
    else if(k==="scorpion"){u.tail.rotation.x=sin(clock*5)*0.2;actor.position.x=b.x-d.x*lunge*0.5;actor.position.z=b.z-d.z*lunge*0.5}
    else if(k==="mummy"){u.body.rotation.x=bad&&t>0.4?-0.7*sm(Math.min(1,(t-0.4)/0.5)):0}
    else if(k==="boat"){actor.position.y=0.02+sin(clock*1.5)*0.05;actor.rotation.z=sin(clock*1.1)*0.03}
    else if(k==="ghost"){actor.position.y=0.25+sin(clock*1.6)*0.12;ghostMat.opacity=0.32+0.15*sin(clock*7)*sin(clock*3)}
    else if(k==="anubis"){glowMat.color.setHSL(0.12,1,0.5+0.2*sin(clock*3))}
    else if(u.armL){ // person, baby, royal
      const g=cine?cine.g:"";
      u.armL.rotation.x=sin(clock*1.3)*0.04;u.armR.rotation.x=-sin(clock*1.3)*0.04;u.armR.rotation.z=0;
      if(cine&&t>0){
        if(g==="talk"||g==="point"||(bad&&g!=="punch")){u.armR.rotation.x=-1.2-0.4*sin(clock*9);u.armL.rotation.x=-0.6+0.3*sin(clock*7)}
        if(g==="give"||g==="reach"||g==="offer"){u.armR.rotation.x=-1.1*e}
        if(g==="wave"){u.armR.rotation.z=2.6*e+0.3*sin(clock*14)}
        if(g==="hug"){u.armL.rotation.x=-1.3*e;u.armR.rotation.x=-1.3*e}
        if(g==="punch"){actor.position.x=b.x+d.x*(out.hit||0)*0.3;actor.position.z=b.z+d.z*(out.hit||0)*0.3;actor.rotation.x=-(out.hit||0)*0.25}
      } else actor.rotation.x=0;
      if(u.head)u.head.rotation.y=sin(clock*0.6)*0.15;

  const P0=tmpV.set(loc.p[0],camH,loc.p[1]);const d=dirXZ();
  P0.addScaledVector(d,cam.fwd||0);P0.y+=(cam.dy||0)+(cam.bob||0)+0.008*sin(clock*1.7);

  let roll=cam.roll||0;if(cine&&cine.death&&t>0.5)roll+=1.2*sm(Math.min(1,(t-0.5)/0.4));

  const f=Math.max(fadeTravel,out.dark||0,deadFade);
  fadeEl.style.opacity=f.toFixed(3);fadeEl.style.background=deadFade>0?"#1a0000":"#000";
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

return{
  play,shot,
  setAge(a){camH=a<2?0.42:a<4?0.6:a<13?0.85+(a-4)*0.06:a<18?1.45:1.62;handScale=a<4?0.55:a<13?0.78:1},
  age(a){tl=now();caption("Age "+a);setTimeout(()=>{if(!cine)caption("")},1300)},
  reset(){deadFade=0;todTarget=0;tod=0;cine=null;caption("");applyLoc("home");spawn(null)}
};
})();
</script>
<script>
(()=>{

const chance=p=>Math.random()<p;

function person(type,o={}){
  const sex=o.sex||pick(["m","f"]);
  const labels={parent:sex==="m"?"Father":"Mother",sibling:sex==="m"?"Brother":"Sister",spouse:sex==="m"?"Husband":"Wife",lover:"Sweetheart",child:sex==="m"?"Son":"Daughter",friend:"Friend",enemy:"Enemy",pet:"Cat"};
  const p={id:S.nid++,type,sex,rel:o.rel||labels[type],name:o.name||pick(NAMES[sex]),age:o.age??0,bond:o.bond??R(50,85),alive:true,used:{}};
  S.people.push(p);return p;
}
const alive=t=>S.people.filter(p=>p.alive&&(!t||p.type===t));
const one=t=>{const a=alive(t);return a.length?pick(a):null};
const tr=(k,n=1)=>{S.tr[k]=(S.tr[k]||0)+n};
const r=(t,o,tone,death)=>[t,o||{},tone||"",death];

function newLife(opts={}){
  W.reset();W.setAge(0);
  const sex=opts.sex||pick(["m","f"]);
  const clsKey=opts.cls||(chance(.04)?"royal":pick(["farmer","farmer","farmer","builder","builder","scribe","priest"]));
  const cls=CLASSES[clsKey];
  S={v:2,name:(opts.name&&opts.name.trim())||pick(NAMES[sex]),sex,cls:clsKey,city:clsKey==="builder"?"Deir el-Medina":clsKey==="royal"?pick(["Thebes","Memphis"]):pick(CITIES),
     age:0,alive:true,health:R(70,100),happy:R(60,95),smarts:R(20,80),looks:R(20,90),maat:50,deben:cls.start,curse:0,
     job:null,school:!!cls.school,years:{},flags:{},cool:{},recent:[],amb:{},tr:{},items:[],people:[],nid:1,used:{}};
  Object.entries(cls.stats).forEach(([k,v])=>S[k]=clamp(S[k]+v));
  const mom=person("parent",{sex:"f",age:R(15,28),bond:R(65,95)});
  const dad=person("parent",{sex:"m",age:R(19,40),bond:R(40,90)});
  if(chance(.65))person("sibling",{age:R(1,8),bond:R(35,80)});
  if(chance(.25))person("sibling",{age:R(2,11),bond:R(30,80)});
  const pj=clsKey==="royal"?"the living god on earth":cls.label;
  log(`You are born in ${S.city}, ${S.sex==="m"?"son":"daughter"} of ${pj}. Your mother is ${mom.name}. Your father is ${dad.name}.`);
  log(clsKey==="royal"?"A priest has already started carving your tomb. You are four hours old.":
      clsKey==="priest"?"The temple sends a basket of bread and a priest who chants at you until you fall asleep.":
      pick(["The midwife says your cry sounds strong. She says that to everyone.","Your father checks if you have all your fingers. Then he checks again, slower.","A cat walks in, looks at you, and leaves. Your grandmother says this is a good sign."]),null,"dim");
  save();render();
}
function fx(o){
  const chips=[];
  for(const k in o){const v=o[k];if(!v)continue;
    if(k==="deben")S.deben=Math.max(0,S.deben+v);
    else if(k==="curse")S.curse=Math.max(0,Math.min(5,S.curse+v));
    else S[k]=clamp(S[k]+v);
    const good=k==="curse"?v<0:v>0;
    chips.push(`<span class="chip ${good?"up":"down"}">${v>0?"+":""}${v} ${STAT_NAMES[k]}</span>`);}
  return chips.length?`<span class="chips">${chips.join("")}</span>`:"";
}
function log(text,o,tone){(S.years[S.age]||(S.years[S.age]=[])).push({t:text,c:o?fx(o):"",tone:tone||""})}

function ambient(){
  const st=stage(S.age);const pool=AMB[st].filter((l,i)=>!S.amb[st+i]);

}

let busy=false;
function actorFor(key){
  const opp=S.sex==="m"?"f":"m";
  const P=t=>{const p=one(t);return p?personActor(p):{type:"person",sex:pick(["m","f"])}};
  switch(key){
    case null:case undefined:case "none":return null;
    case "parent":return P("parent");case "spouse":return P("spouse");case "sibling":return P("sibling");
    case "cat":return {type:"cat"};case "goose":return {type:"goose"};case "goat":return {type:"goat"};case "scorpion":return {type:"scorpion"};
    case "hippo":return {type:"hippo"};case "croc":return {type:"croc"};case "mummy":return {type:"mummy"};case "boat":return {type:"boat"};
    case "baby":return {type:"person",kind:"baby",scale:0.42};
    case "kid":return {type:"person",sex:"m",scale:0.72};
    case "crush":return {type:"person",sex:opp};
    case "man":return {type:"person",sex:"m"};case "woman":return {type:"person",sex:"f"};
    case "teacher":return {type:"person",sex:"m",kind:"teacher",old:true};
    case "priest":return {type:"person",sex:"m",kind:"priest"};
    case "scribe":return {type:"person",sex:"m",kind:"teacher"};
    case "soldier":return {type:"person",sex:"m",kind:"soldier"};
    case "stranger":return {type:"person",sex:"m",kind:"stranger"};
    case "pharaoh":return {type:"person",sex:"m",kind:"royal"};
    case "anubis":return {type:"person",sex:"m",kind:"anubis",scale:1.25};
    case "ghost":return {type:"person",sex:pick(["m","f"]),kind:"ghost"};
    case "friend":return one("friend")?personActor(one("friend")):{type:"person",sex:pick(["m","f"]),scale:S.age<13?0.72:1};
  }
  return null;
}
function personActor(p){
  if(p.type==="pet")return p.alive?{type:"cat"}:null;
  if(!p.alive)return null;
  if(p.age<4)return {type:"person",kind:"baby",scale:0.42};
  return {type:"person",sex:p.sex,scale:p.age<13?0.5+p.age*0.035:p.age<16?0.9:1,old:p.age>50};
}

function guessG(label){
  const l=label.toLowerCase();
  const R_=[[/pray|thank|swear|oath/,"pray"],[/letter|write|poem|draw|read/,"write"],[/swim/,"swim"],[/run|flee|leave the|walk away|back away|move house/,"run"],
   [/fight|hit him|squash|punch|wrestle|step up|join them|war/,"punch"],[/throw|spit|toss/,"throw"],[/steal|pocket|grab|touch|catch|take|pick/,"reach"],
   [/eat|swallow/,"eat"],[/drink|go all in|one cup/,"drink"],[/give|share|pay|buy|bribe|offer|feed|wrap/,"give"],[/hide/,"crouch"],
   [/scream|cry|complain/,"flail"],[/hold|cuddle|gentle|spoil|baby|have the/,"hug"],[/smash|curse|sabotage|clay figure/,"smash"],
   [/talk|tell|ask|investigate|report|apolog|flatter|blame|accept|beg|raise the alarm/,"talk"],[/work|keep working|carry|help|care/,"carry"],
   [/study|listen through/,"write"],[/look|watch|admire|sneak behind/,"look"],[/nap|sleep|wake/,"sleep"],[/join the strike|bow|fall down/,"crouch"]];
  for(const [re,g] of R_)if(re.test(l))return g;
  return "none";
}
function evCue(e){const c=EV_CUE[e.id]||["home","none"];const loc=c[0]==="job"?(JOB_LOC[S.job]||"home"):c[0];return{loc,actor:actorFor(c[1]),night:!!c[2]}}
function actCue(a){const c=ACT_CUE[a.k]||["home","none"];return{loc:c[0],g:c[1],actor:actorFor(c[2]),prop:c[3]||undefined,night:!!c[4],label:a.label}}
function intCue(p,o){
  const g=INT_G[o.k]||guessG(o.label);
  let loc="home",night=false;
  if(!p.alive&&p.type!=="pet")loc="necro";
  if(o.k==="date"){loc="river";night=true}
  if(o.k==="beer"){loc="market";night=true}
  if(o.k==="hang"||o.k==="end"||o.k==="betray")loc="market";
  return{loc,g,actor:personActor(p),prop:o.k in INT_PROP?INT_PROP[o.k]:undefined,night,label:o.label}
}

/* ================= year loop ================= */
function ageUp(){
  if(!S.alive||pending||busy)return;
  S.age++;W.setAge(S.age);W.age(S.age);S.used={};S.people.forEach(p=>p.used={});
  S.people.forEach(p=>{if(!p.alive)return;p.age++;
    const lim=p.type==="pet"?12:40;
    const risk=p.age>lim?(p.age-lim)*(p.type==="pet"?.12:.012):(p.type==="child"&&p.age<5?.02:.004);
    if(chance(risk)){p.alive=false;
      if(p.type==="pet")log(`${p.name} the cat died. The whole house shaves their eyebrows in mourning. Egyptians really did this.`,{happy:-12},"bad");
      else{const inh=p.type==="parent"&&S.age>=16?Math.round(CLASSES[S.cls].start/4+R(2,15)):0;
        log(`Your ${p.rel.toLowerCase()}, ${p.name}, died at ${p.age}. ${pick(["The embalmers take 70 days.","They're buried with bread, beer, and their favourite sandals.","The hired mourners wail. They earn every deben."])}${inh?` You inherit ${inh} deben.`:""}`,{happy:-15,deben:inh},"bad");}
    } else if(p.type!=="pet") p.bond=clamp(p.bond+R(-4,2));
    if(p.type==="lover"&&p.bond<20&&p.alive){p.alive=false;p.left=true;log(`${p.name} stopped waiting for you and moved on.`,{happy:-6},"bad")}
  });
  const d={};
  if(S.age>30)d.health=-R(1,4);
  if(S.age>45)d.looks=-R(1,3);
  if(S.age<18)d.smarts=S.school&&S.age>=5?R(1,4):R(0,1);
  if(S.curse)d.happy=-S.curse*2;
  const c=CLASSES[S.cls];
  if(S.age>=5&&S.age<18&&c.allow)d.deben=c.allow;
  if(S.job){const j=jobOf(S.job);d.deben=(d.deben||0)+j.pay+(S.bonus||0);if(S.job==="embalmer"&&chance(.1))d.curse=1;}
  else if(S.cls==="royal"&&S.age>=18)d.deben=60;
  if(Object.keys(d).length)log(S.job?`Another year as a ${jobOf(S.job).label.toLowerCase()}.`:c.allow&&S.age>=5&&S.age<18?"Your family gives you some pocket money.":"The year goes by.",d,"dim");
  ambient();
  // death
  let risk=S.age<4?.01:S.age<30?.003:.003+(S.age-30)*.004;
  if(S.age>60)risk+=(S.age-60)*.018;
  if(S.health<25)risk+=.12;
  if(S.curse>=5)risk+=.15;
  if(S.health<=0||chance(risk)){
    const cause=S.curse>=4&&chance(.6)?"claimed by the curses you collected":S.health<25?pick(["a fever no spell could break","an infected tooth","the breath of Sekhmet"]):S.age<5?pick(["a childhood fever","a scorpion in the dark"]):S.age>55?"old age, which in Egypt is a flex":pick(["a fall from a roof","a scorpion in the dark","a hippo","bad fish"]);
    render();busy=true;W.play({label:"Age "+S.age},["",{},"bad",cause]).then(()=>{busy=false;die(cause)});return;
  }
  // events: rare, weighted, cooldowns
  const st=stage(S.age);
  const pool=EVENTS.filter(e=>e.st.includes(st)&&S.age>=(e.min??0)&&S.age<=(e.max??200)&&
    (S.cool[e.id]===undefined||S.age-S.cool[e.id]>=(e.cd??10))&&!S.recent.includes(e.id)&&(!e.needs||e.needs()));
  const q=[];
  const n=chance(.38)?(chance(.1)?2:1):0;
  for(let i=0;i<n&&pool.length;i++){
    const ws=pool.map(e=>(e.w??1)*(e.wt?e.wt():1));const tot=ws.reduce((a,b)=>a+b,0);
    let x=Math.random()*tot,idx=0;for(;idx<ws.length-1;idx++){x-=ws[idx];if(x<=0)break}
    q.push(pool.splice(idx,1)[0]);
  }
  pending=q;save();render();busy=true;setTimeout(()=>{busy=false;nextEvent()},q.length?1000:300);
}

function nextEvent(){
  if(!pending||!pending.length){pending=null;save();render();return}
  const e=pending.shift();S.cool[e.id]=S.age;S.recent=[e.id,...S.recent].slice(0,6);
  const text=typeof e.text==="function"?e.text():e.text;
  if(e.auto){log(text,e.auto[1],e.auto[2]);render();return nextEvent()}
  const opts=e.ch.filter(c=>!c[2]||c[2]());
  const cue=evCue(e);W.shot(cue);
  openSheet(`<p class="kicker">Age ${S.age}</p><h2>${esc(e.title||"Something happens")}</h2><p class="body">${esc(text)}</p><div class="choices">${opts.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c[0])}</button>`).join("")}</div>`,false);
  $("#sheet").querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const c=opts[+b.dataset.i];resolve(c[1](),()=>nextEvent(),Object.assign({},cue,{g:guessG(c[0]),label:c[0]}))});
}

function resolve(res,after,cue){
  closeSheet();busy=true;
  W.play(cue||{},res).then(()=>{busy=false;finish(res,after)});
}
function finish(res,after){
  const [t,o,tone,death]=res;
  const before=S.years[S.age]?S.years[S.age].length:0;
  log(t,o,tone);
  const chips=S.years[S.age][before].c;
  if(death){closeSheet();render();return die(death)}
  if(S.health<=0){closeSheet();render();busy=true;W.play({},["",{},"bad","x"]).then(()=>{busy=false;die("injuries that honey could not fix")});return}
  render();
  openSheet(`<div class="result ${tone==="bad"?"bad":""}">${esc(t)}${chips}</div><button class="big-btn" id="okBtn">Continue</button>`,false);
  $("#okBtn").onclick=()=>{closeSheet();after&&after()};$("#okBtn").focus();
}

function visibleActs(cat){return ACTS.filter(a=>a.c===cat&&S.age>=(a.min??0)&&S.age<=(a.max??200)&&(!a.need||a.need()))}
function menuActs(){
  const cats=CATS.filter(c=>visibleActs(c.k).length);

function weighing(){

  ];
  const scarab=S.items.includes("Heart scarab");
  const weight=S.maat-S.curse*8+(scarab?6:0);

  $("#hall").hidden=false;

    <p class="sub">The Hall of Two Truths · Age ${S.age}</p>

      <rect x="164" y="70" width="12" height="130" fill="#b07d1f"/><rect x="120" y="198" width="100" height="12" rx="3" fill="#b07d1f"/>
      <g class="beam" id="beam"><rect x="50" y="64" width="240" height="10" rx="5" fill="#d9a93f"/><circle cx="170" cy="69" r="10" fill="#f0bf55"/></g>
      <g class="panL" id="panL"><line x1="60" y1="70" x2="35" y2="140" stroke="#d9a93f" stroke-width="2"/><line x1="60" y1="70" x2="85" y2="140" stroke="#d9a93f" stroke-width="2"/><path d="M25 140 h70 a35 14 0 0 1 -70 0z" fill="#d9a93f"/><path d="M60 128 c-10-14-26-2-14 10 l14 12 l14-12 c12-12-4-24-14-10z" fill="#d9573b"/></g>
      <g class="panR" id="panR"><line x1="280" y1="70" x2="255" y2="140" stroke="#d9a93f" stroke-width="2"/><line x1="280" y1="70" x2="305" y2="140" stroke="#d9a93f" stroke-width="2"/><path d="M245 140 h70 a35 14 0 0 1 -70 0z" fill="#d9a93f"/><path d="M280 138 c-4-14-2-26 6-34 c4 10 2 24-6 34z" fill="#ece3cc"/><line x1="280" y1="138" x2="285" y2="106" stroke="#a49d8a" stroke-width="1"/></g>
    </svg>
    <p class="sub">Anubis checks the scale. Thoth holds his pen. Ammit, part crocodile, part lion, part hippo, is drooling.</p>
    <ul class="conf" id="conf">${conf.map(c=>`<li><span>${c[0]}</span><b class="${c[1]?"t":"l"}">${c[1]?"TRUE":"LIE"}</b></li>`).join("")}${S.curse?`<li><span>Curses on your soul</span><b class="l">${S.curse} × heavier</b></li>`:""}${scarab?`<li><span>Heart scarab keeps your heart quiet</span><b class="t">HELPS</b></li>`:""}</ul>
    <p class="verdict" id="verdict"></p>
    <div id="after" hidden style="width:100%;display:flex;flex-direction:column;gap:10px"></div></div>`;
  const lis=[...document.querySelectorAll("#conf li")];
  lis.forEach((li,i)=>setTimeout(()=>li.classList.add("show"),400+i*420));
  const t0=600+lis.length*420;
  setTimeout(()=>$("#scale").classList.add("wobble"),t0);
  setTimeout(()=>{$("#scale").classList.remove("wobble");$("#beam").style.transform=`rotate(${angle}deg)`;
    const dy=Math.round(110*Math.sin(angle*Math.PI/180));$("#panL").style.transform=`translateY(${-dy}px)`;$("#panR").style.transform=`translateY(${dy}px)`},t0+1600);
  setTimeout(()=>{
    $("#verdict").innerHTML=pass?`Your heart is as light as the feather of Ma'at.<br><span style="color:var(--faience)">Welcome to the Field of Reeds.</span>`:`Your heart is heavier than the feather.<br><span style="color:var(--carnelian)">Ammit eats it. You stop existing. Forever.</span>`;
    const kids=S.people.filter(p=>p.type==="child").length;const t=traitList();
    const a=$("#after");a.hidden=false;
    a.innerHTML=`<div class="card">
      <div class="row"><span>Name</span><span>${esc(S.name)}</span></div>
      <div class="row"><span>Born to</span><span>${esc(CLASSES[S.cls].label)}, ${esc(S.city)}</span></div>
      <div class="row"><span>Died</span><span>Age ${S.age}, ${esc(S.cause)}</span></div>
      <div class="row"><span>Known as</span><span>${t.length?esc(t.slice(0,3).join(", ")):"Nobody in particular"}</span></div>
      <div class="row"><span>Job</span><span>${S.job?esc(jobOf(S.job).label):"None"}</span></div>
      <div class="row"><span>Wealth</span><span>${S.deben} deben</span></div>
      <div class="row"><span>Children</span><span>${kids}</span></div>
      <div class="row"><span>Ma'at</span><span>${S.maat}/100${S.curse?`, ${S.curse} curse${S.curse>1?"s":""}`:""}</span></div>
      <div class="row" style="border:0"><span>Afterlife</span><span style="color:${pass?"var(--faience)":"var(--carnelian)"}">${pass?"Field of Reeds":"Devoured by Ammit"}</span></div></div>
     <button class="big-btn" id="again">Live another life</button>
     <button class="big-btn ghost" id="review">Read your life story</button>`;
    $("#again").onclick=()=>{$("#hall").hidden=true;showStart()};
    $("#review").onclick=()=>{$("#hall").hidden=true};
    $("#again").focus();
  },t0+3200);
}

/* ================= render ================= */
function render(){
  if(!S)return;
  $("#name").textContent=S.name;
  const job=S.job?jobOf(S.job).label:(S.cls==="royal"?"Royal":"");
  $("#meta").textContent=`${S.alive?"Age "+S.age:"Died at "+S.age} · ${S.city}${job?" · "+job:""}`;
  $("#traits").innerHTML=traitList().slice(0,3).map(t=>`<span>${esc(t)}</span>`).join("");
  $("#deben").textContent=S.deben;
  $("#ava").textContent=!S.alive?"𓋹":S.age<4?"𓀔":S.cls==="royal"?"𓀭":S.sex==="m"?"𓀀":"𓁐";
  document.querySelectorAll(".stat").forEach(el=>{const v=S[el.dataset.k];el.querySelector("output").textContent=v;const i=el.querySelector("i");i.style.width=v+"%";
    if(el.dataset.k!=="maat")i.style.background=v<25?"var(--carnelian)":v<50?"var(--ember)":"var(--faience)"});
  $("#pips").innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<S.curse?"on":""}"></span>`).join("");
  const ages=Object.keys(S.years).map(Number).sort((a,b)=>a-b);
  $("#log").innerHTML=ages.map(a=>`<div class="year"><h3>Age ${a}</h3>${S.years[a].map(l=>`<p class="${l.tone}">${esc(l.t)}${l.c}</p>`).join("")}</div>`).join("");
  const lg=$("#log");lg.scrollTop=lg.scrollHeight;
  ["#bAge","#bJob","#bAct","#bPeople"].forEach(s=>{$(s).disabled=!S.alive;$(s).style.opacity=S.alive?1:.4});
}

/* ================= start ================= */
function showStart(){
  const st={sex:null,cls:null};const el=$("#start");el.hidden=false;
  el.innerHTML=`<div class="start-in">
    <div class="glyphs" aria-hidden="true">𓂀𓋹𓆄</div>
    <h1>Heart vs Feather</h1>
    <p class="tag">Live one life in Ancient Egypt, a year at a time. When you die, your heart goes on the scale. Lighter than a feather and you live forever. Heavier, and a crocodile-lion-hippo eats it.</p>
    <div class="opts"><label for="nm">Name</label><input id="nm" placeholder="Leave empty for a random name" maxlength="20"></div>
    <div class="opts"><label>Born as</label><div class="seg" id="sx"><button data-v="" aria-pressed="true">Random</button><button data-v="m" aria-pressed="false">Son</button><button data-v="f" aria-pressed="false">Daughter</button></div></div>
    <div class="opts"><label>Born to</label><div class="seg" id="cl2"><button data-v="" aria-pressed="true">Fate decides</button><button data-v="farmer" aria-pressed="false">Farmers</button><button data-v="builder" aria-pressed="false">Tomb builders</button><button data-v="scribe" aria-pressed="false">Scribes</button><button data-v="priest" aria-pressed="false">Priests</button><button data-v="royal" aria-pressed="false">Pharaoh</button></div></div>
    <button class="big-btn" id="go">Be born</button></div>`;
  const seg=(id,key)=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");st[key]=b.dataset.v||null});
  seg("sx","sex");seg("cl2","cls");
  $("#go").onclick=()=>{el.hidden=true;newLife({name:$("#nm").value,sex:st.sex,cls:st.cls})};
}

/* ================= save / boot ================= */
function save(){try{localStorage.setItem("hvf2",JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("hvf2")||"null")}catch(e){return null}}
const guard=f=>()=>{if(!busy)f()};$("#bAge").onclick=guard(ageUp);$("#bAct").onclick=guard(menuActs);$("#bJob").onclick=guard(menuJob);$("#bPeople").onclick=guard(menuPeople);$("#bMore").onclick=guard(menuLife);
function start(data){
  const saved=(data&&data.S)||load();
  if(saved&&saved.v===2&&saved.name){S=saved;pending=null;W.setAge(S.age);render()}
  else{S={v:2,name:"Nebamun",sex:"m",cls:"farmer",city:"Thebes",age:0,alive:true,health:90,happy:80,smarts:50,looks:55,maat:50,deben:0,curse:0,job:null,school:false,years:{0:[{t:"Choose how you're born to begin.",c:"",tone:"dim"}]},flags:{},cool:{},recent:[],amb:{},tr:{},items:[],people:[],nid:1,used:{}};render();showStart()}
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
